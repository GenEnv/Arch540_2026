<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker></defs><text x="14" y="22" font-size="15" font-weight="bold" fill="#222">Step 1: one instruction, no hands</text><rect x="20" y="90" width="140" height="70" rx="8" fill="#3a6ea5" fill-opacity="0.13" stroke="#3a6ea5" stroke-width="2"/><text x="90.0" y="123.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">You</text><text x="90.0" y="139.0" font-size="11" text-anchor="middle" fill="#444">brief, lot, rules</text><text x="90.0" y="152.0" font-size="11" text-anchor="middle" fill="#444">+ one request</text><rect x="210" y="50" width="470" height="150" rx="14" fill="none" stroke="#e0642f" stroke-width="1.5" stroke-dasharray="7 5"/><text x="220" y="66" font-size="12" fill="#e0642f" text-anchor="start" font-weight="bold">the loop the model runs itself</text><rect x="230" y="90" width="130" height="70" rx="8" fill="#e0642f" fill-opacity="0.13" stroke="#e0642f" stroke-width="2"/><text x="295.0" y="123.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Claude</text><text x="295.0" y="139.0" font-size="11" text-anchor="middle" fill="#444">decides what</text><text x="295.0" y="152.0" font-size="11" text-anchor="middle" fill="#444">to do next</text><rect x="400" y="60" width="130" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="465.0" y="90.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Write / run a script</text><rect x="400" y="140" width="130" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="465.0" y="170.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Read what came back</text><rect x="720" y="90" width="150" height="70" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="795.0" y="123.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Files</text><text x="795.0" y="139.0" font-size="11" text-anchor="middle" fill="#444">layout + plan drawing</text><line x1="160" y1="125" x2="230" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="110" x2="400" y2="85" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="465" y1="110" x2="465" y2="140" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="465.0" y="119.0" font-size="11" text-anchor="middle" fill="#333">result</text><line x1="400" y1="165" x2="360" y2="140" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="680" y1="125" x2="720" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="700" y="110" font-size="11" text-anchor="middle" fill="#333">stops when it
thinks it is done</text><text x="20" y="235" font-size="12" fill="#444" text-anchor="start">Exit: the model decides. Nothing outside the model checks the rules.</text></svg>