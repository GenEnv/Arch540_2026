<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker></defs><text x="14" y="22" font-size="15" font-weight="bold" fill="#222">Step 4: a second role that only sees the result</text><rect x="20" y="110" width="110" height="70" rx="8" fill="#3a6ea5" fill-opacity="0.13" stroke="#3a6ea5" stroke-width="2"/><text x="75.0" y="143.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">You</text><text x="75.0" y="159.0" font-size="11" text-anchor="middle" fill="#444">same request</text><text x="75.0" y="172.0" font-size="11" text-anchor="middle" fill="#444">+ 'have the reviewer</text><text x="75.0" y="185.0" font-size="11" text-anchor="middle" fill="#444">check it'</text><rect x="190" y="100" width="150" height="90" rx="8" fill="#e0642f" fill-opacity="0.13" stroke="#e0642f" stroke-width="2"/><text x="265.0" y="135.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Designer</text><text x="265.0" y="151.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(Claude)</text><text x="265.0" y="167.0" font-size="11" text-anchor="middle" fill="#444">own context:</text><text x="265.0" y="180.0" font-size="11" text-anchor="middle" fill="#444">all its reasoning</text><rect x="420" y="60" width="130" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="485.0" y="90.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">layout file</text><rect x="420" y="200" width="130" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="485.0" y="230.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">check.py</text><rect x="620" y="100" width="150" height="90" rx="8" fill="#e0642f" fill-opacity="0.13" stroke="#e0642f" stroke-width="2"/><text x="695.0" y="135.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Reviewer</text><text x="695.0" y="151.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(Claude)</text><text x="695.0" y="167.0" font-size="11" text-anchor="middle" fill="#444">own context:</text><text x="695.0" y="180.0" font-size="11" text-anchor="middle" fill="#444">sees only the file</text><text x="695.0" y="193.0" font-size="11" text-anchor="middle" fill="#444">and checker output</text><rect x="780" y="250" width="100" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="830.0" y="273.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Verdict</text><text x="830.0" y="289.0" font-size="11" text-anchor="middle" fill="#444">APPROVE / REJECT</text><line x1="130" y1="145" x2="190" y2="145" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="125" x2="420" y2="90" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="380" y="85" font-size="11" text-anchor="middle" fill="#333">hand-off = a file</text><line x1="550" y1="85" x2="620" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="550" y1="225" x2="620" y2="165" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="720" y1="190" x2="800" y2="250" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="620" y1="200" x2="340" y2="190" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="480" y="255" font-size="11" text-anchor="middle" fill="#333">REJECT: reasons</text><text x="20" y="312" font-size="12" fill="#444" text-anchor="start">The designer's explanation never reaches the reviewer. A reject sends the designer round again.</text></svg>