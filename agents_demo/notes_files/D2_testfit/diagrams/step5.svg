<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker></defs><text x="14" y="22" font-size="15" font-weight="bold" fill="#222">Step 5: a check the model cannot bypass, and a limit</text><rect x="20" y="120" width="100" height="70" rx="8" fill="#3a6ea5" fill-opacity="0.13" stroke="#3a6ea5" stroke-width="2"/><text x="70.0" y="153.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">You</text><text x="70.0" y="169.0" font-size="11" text-anchor="middle" fill="#444">same request</text><rect x="160" y="110" width="130" height="90" rx="8" fill="#e0642f" fill-opacity="0.13" stroke="#e0642f" stroke-width="2"/><text x="225.0" y="152.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Designer</text><text x="225.0" y="168.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(Claude)</text><rect x="350" y="120" width="140" height="70" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="420.0" y="153.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Hook</text><text x="420.0" y="169.0" font-size="11" text-anchor="middle" fill="#444">runs check.py</text><text x="420.0" y="182.0" font-size="11" text-anchor="middle" fill="#444">outside the model</text><rect x="560" y="60" width="130" height="50" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="625.0" y="83.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">output/</text><text x="625.0" y="99.0" font-size="11" text-anchor="middle" fill="#444">written only if clean</text><rect x="560" y="210" width="200" height="60" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="660.0" y="230.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Block message</text><text x="660.0" y="246.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">back to Claude</text><text x="660.0" y="262.0" font-size="11" text-anchor="middle" fill="#444">which rule, which building</text><rect x="740" y="100" width="140" height="60" rx="8" fill="#e0642f" fill-opacity="0.13" stroke="#e0642f" stroke-width="2"/><text x="810.0" y="135.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Reviewer</text><rect x="350" y="250" width="140" height="60" rx="8" fill="#5e9e3e" fill-opacity="0.13" stroke="#5e9e3e" stroke-width="2"/><text x="420.0" y="278.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">Counter</text><text x="420.0" y="294.0" font-size="11" text-anchor="middle" fill="#444">blocks so far / limit</text><line x1="120" y1="155" x2="160" y2="155" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="290" y1="155" x2="350" y2="155" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="320" y="140" font-size="11" text-anchor="middle" fill="#333">tries to write</text><line x1="490" y1="140" x2="560" y2="90" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="505" y="105" font-size="11" text-anchor="middle" fill="#333">clean</text><line x1="490" y1="175" x2="560" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="515" y="205" font-size="11" text-anchor="middle" fill="#333">fails</text><line x1="560" y1="245" x2="225" y2="200" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="420" y1="190" x2="420" y2="250" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="690" y1="85" x2="740" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="520" y="300" font-size="12" fill="#e0642f" text-anchor="start" font-weight="bold">Limit reached: message says stop, write UNRESOLVED.</text><text x="20" y="332" font-size="12" fill="#444" text-anchor="start">Everything green here is code outside the model. The model can be wrong; the hook cannot be argued with.</text></svg>